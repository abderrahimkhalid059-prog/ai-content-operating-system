name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  BLOGGER_MODE: mock

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build -w @ai-content-os/api
      - run: npm run build -w @ai-content-os/web
      - run: npm run build -w @ai-content-os/worker

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ai_content_os_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d ai_content_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/ai_content_os_test?schema=public
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/ai_content_os_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379
      SEED_OWNER_PASSWORD: Phase1-CI-Seed-Password-9472
      PASSWORD_MIN_LENGTH: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Generate integration test encryption key
        shell: bash
        run: |
          echo "INTEGRATION_ENCRYPTION_KEY=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64"))')" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY_VERSION=ci-test-v1" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy -w @ai-content-os/database
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run test:integration

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEED_OWNER_PASSWORD: Phase1-CI-Seed-Password-9472
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: docker compose build api worker web
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose run --rm migrate npm run db:seed -w @ai-content-os/database
      - run: node infrastructure/scripts/validate-stack.mjs
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
