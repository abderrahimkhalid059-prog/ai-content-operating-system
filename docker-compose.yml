name: ai-content-os

x-api-image: &api-image
  image: ai-content-os-api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  API_PORT: ${API_PORT:-3000}
  WEB_PORT: ${WEB_PORT:-5173}
  DATABASE_URL: postgresql://${POSTGRES_USER:-ai_content_os}:${POSTGRES_PASSWORD:-development_only}@postgres:5432/${POSTGRES_DB:-ai_content_os}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-only-access-secret-change-before-production}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-development-only-refresh-secret-change-before-production}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ai_content_os_refresh}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
  LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-60s}
  LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
  SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-developer@example.invalid}
  SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  APP_URL: ${APP_URL:-http://localhost:5173}
  API_URL: ${API_URL:-http://localhost:3000/api/v1}
  BLOGGER_MODE: ${BLOGGER_MODE:-mock}
  GOOGLE_BLOGGER_CLIENT_ID: ${GOOGLE_BLOGGER_CLIENT_ID:-}
  GOOGLE_BLOGGER_CLIENT_SECRET: ${GOOGLE_BLOGGER_CLIENT_SECRET:-}
  GOOGLE_BLOGGER_REDIRECT_URI: ${GOOGLE_BLOGGER_REDIRECT_URI:-http://localhost:3000/api/v1/integrations/blogger/callback}
  GOOGLE_BLOGGER_SCOPES: ${GOOGLE_BLOGGER_SCOPES:-https://www.googleapis.com/auth/blogger}
  BLOGGER_API_BASE_URL: ${BLOGGER_API_BASE_URL:-https://www.googleapis.com/blogger/v3}
  BLOGGER_OAUTH_AUTH_URL: ${BLOGGER_OAUTH_AUTH_URL:-https://accounts.google.com/o/oauth2/v2/auth}
  BLOGGER_OAUTH_TOKEN_URL: ${BLOGGER_OAUTH_TOKEN_URL:-https://oauth2.googleapis.com/token}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
  INTEGRATION_ENCRYPTION_KEY_VERSION: ${INTEGRATION_ENCRYPTION_KEY_VERSION:-v1}
  BLOGGER_ALLOW_PUBLIC_PUBLISH: ${BLOGGER_ALLOW_PUBLIC_PUBLISH:-false}
  BLOGGER_ALLOW_DELETE: ${BLOGGER_ALLOW_DELETE:-false}
  BLOGGER_REQUEST_TIMEOUT_MS: ${BLOGGER_REQUEST_TIMEOUT_MS:-10000}
  BLOGGER_MAX_RETRIES: ${BLOGGER_MAX_RETRIES:-3}
  BLOGGER_SYNC_PAGE_SIZE: ${BLOGGER_SYNC_PAGE_SIZE:-50}
  SEED_MOCK_BLOGGER_CONNECTION: ${SEED_MOCK_BLOGGER_CONNECTION:-false}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_content_os}
      POSTGRES_USER: ${POSTGRES_USER:-ai_content_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development_only}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  migrate:
    <<: *api-image
    environment: *app-environment
    command: ['npm', 'run', 'db:migrate:deploy', '-w', '@ai-content-os/database']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    networks: [backend]

  api:
    <<: *api-image
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [backend, frontend]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [frontend]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    internal: true
  frontend:
